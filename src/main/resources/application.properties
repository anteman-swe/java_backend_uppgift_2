# Server Configuration
server.port=8080
server.servlet.context-path=/

# Spring Configuration
spring.application.name=Helpdesk System
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# Database Configuration
# For Docker Compose: use 'postgres' as hostname (service name in docker-compose.yml)
# For local development: use 'localhost' if PostgreSQL is running locally
spring.datasource.url=jdbc:postgresql://postgres:5432/helpdesk
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Security Configuration
spring.security.user.name=admin
spring.security.user.password=admin
spring.security.user.roles=ADMIN

# Session Configuration
server.servlet.session.timeout=30m

# Wait for database to be available (for Docker)
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
