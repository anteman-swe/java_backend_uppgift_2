<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Login - Helpdesk System</title>
    
    <!-- Tailwind CSS -->
    <link rel="stylesheet" th:href="@{/css/output.css}">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    
    <style>
        .login-container {
            max-width: 400px;
        }
        .login-card {
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .login-header {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border-top-left-radius: 0.75rem;
            border-top-right-radius: 0.75rem;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="login-container w-full">
        <div class="login-card bg-white overflow-hidden">
            <div class="login-header text-white p-6 text-center">
                <i class="fas fa-ticket-alt text-4xl"></i>
                <h3 class="mt-3 text-xl font-bold">Helpdesk System</h3>
                <p class="mt-1 text-blue-100">Please login to continue</p>
            </div>
            <div class="p-6">
                <form th:action="@{/login}" method="post">
                    <div class="mb-4">
                        <label for="username" class="block text-sm font-medium text-gray-700 mb-1">
                            Username
                        </label>
                        <input type="text" id="username" name="username" 
                               class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                               placeholder="Enter your username" required autofocus>
                    </div>
                    <div class="mb-6">
                        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
                            Password
                        </label>
                        <input type="password" id="password" name="password" 
                               class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                               placeholder="Enter your password" required>
                    </div>
                    <div>
                        <button type="submit" 
                                class="w-full flex justify-center items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                            <i class="fas fa-sign-in-alt mr-2"></i>
                            Login
                        </button>
                    </div>
                </form>
                
                <div th:if="${param.error}" class="mt-4 p-4 bg-red-50 border border-red-200 rounded-md">
                    <div class="flex">
                        <i class="fas fa-exclamation-triangle text-red-500 mr-2 mt-1"></i>
                        <p class="text-sm text-red-700">Invalid username or password</p>
                    </div>
                </div>
                
                <div th:if="${param.logout}" class="mt-4 p-4 bg-green-50 border border-green-200 rounded-md">
                    <div class="flex">
                        <i class="fas fa-check-circle text-green-500 mr-2 mt-1"></i>
                        <p class="text-sm text-green-700">You have been logged out successfully</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
