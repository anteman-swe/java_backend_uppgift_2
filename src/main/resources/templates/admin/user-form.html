<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      lang="en"
      xml:lang="en">
<head>
    <title th:text="${title}">User Form</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="max-w-3xl mx-auto">
            <div class="bg-white rounded-lg shadow p-6">
                <h2 class="text-2xl font-bold text-gray-800 mb-6" th:text="${title}">User Form</h2>
                
                <form th:action="${isEdit ? '/admin/users/' + user.id + '/edit' : '/admin/users/new'}" 
                      th:object="${user}" method="post">
                    
                    <div class="mb-4">
                        <label for="username" class="block text-sm font-medium text-gray-700 mb-1">
                            Username <span class="text-red-500">*</span>
                        </label>
                        <input type="text" id="username" th:field="*{username}" 
                               class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                               placeholder="Enter username" required 
                               th:readonly="${isEdit}">
                        <div class="text-red-500 text-xs mt-1" th:if="${#fields.hasErrors('username')}" 
                             th:errors="*{username}"></div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
                            Password <span class="text-red-500" th:if="${!isEdit}">*</span>
                        </label>
                        <input type="password" id="password" th:field="*{password}" 
                               class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                               placeholder="Enter password" 
                               th:required="${!isEdit}">
                        <div class="text-red-500 text-xs mt-1" th:if="${#fields.hasErrors('password')}" 
                             th:errors="*{password}"></div>
                        <small class="text-gray-500 text-xs mt-1 block" th:if="${isEdit}">
                            Leave empty to keep current password
                        </small>
                    </div>

                    <div class="mb-4">
                        <label for="firstName" class="block text-sm font-medium text-gray-700 mb-1">
                            First Name <span class="text-red-500">*</span>
                        </label>
                        <input type="text" id="firstName" th:field="*{firstName}" 
                               class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                               placeholder="Enter first name" required>
                        <div class="text-red-500 text-xs mt-1" th:if="${#fields.hasErrors('firstName')}" 
                             th:errors="*{firstName}"></div>
                    </div>

                    <div class="mb-4">
                        <label for="lastName" class="block text-sm font-medium text-gray-700 mb-1">
                            Last Name <span class="text-red-500">*</span>
                        </label>
                        <input type="text" id="lastName" th:field="*{lastName}" 
                               class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                               placeholder="Enter last name" required>
                        <div class="text-red-500 text-xs mt-1" th:if="${#fields.hasErrors('lastName')}" 
                             th:errors="*{lastName}"></div>
                    </div>

                    <div class="mb-4">
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
                            Email <span class="text-red-500">*</span>
                        </label>
                        <input type="email" id="email" th:field="*{email}" 
                               class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                               placeholder="Enter email" required>
                        <div class="text-red-500 text-xs mt-1" th:if="${#fields.hasErrors('email')}" 
                             th:errors="*{email}"></div>
                    </div>

                    <div class="mb-4">
                        <label for="role" class="block text-sm font-medium text-gray-700 mb-1">
                            Role <span class="text-red-500">*</span>
                        </label>
                        <select id="role" th:field="*{role}" 
                                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" required>
                            <option value="" selected disabled>Select role</option>
                            <option th:each="role : ${roles}" 
                                    th:value="${role}" th:text="${role}"></option>
                        </select>
                        <div class="text-red-500 text-xs mt-1" th:if="${#fields.hasErrors('role')}" 
                             th:errors="*{role}"></div>
                    </div>

                    <div class="mb-4" th:if="${isEdit}">
                        <label class="flex items-center">
                            <input type="checkbox" id="active" th:field="*{active}" 
                                   class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
                            <span class="ml-2 block text-sm text-gray-700">
                                <span th:if="${user.active}">Active</span>
                                <span th:if="${!user.active}">Inactive</span>
                            </span>
                        </label>
                    </div>

                    <div class="flex justify-end space-x-3">
                        <a th:href="@{/admin/users}" class="inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                            <i class="fas fa-arrow-left mr-2"></i> Cancel
                        </a>
                        <button type="submit" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                            <i class="fas fa-check-circle mr-2"></i> 
                            <span th:text="${isEdit ? 'Update User' : 'Create User'}"></span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
