<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout/base}">
<head>
    <title th:text="${title}">User Form</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="card">
                        <div class="card-header">
                            <h2 th:text="${title}">User Form</h2>
                        </div>
                        <div class="card-body">
                            <form th:action="${isEdit ? '/admin/users/' + user.id + '/edit' : '/admin/users/new'}" 
                                  th:object="${user}" method="post">
                                
                                <div class="mb-3">
                                    <label for="username" class="form-label">Username <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="username" th:field="*{username}" 
                                           placeholder="Enter username" required 
                                           th:readonly="${isEdit}">
                                    <div class="text-danger" th:if="${#fields.hasErrors('username')}" 
                                         th:errors="*{username}"></div>
                                </div>

                                <div class="mb-3">
                                    <label for="password" class="form-label">
                                        Password <span class="text-danger" th:if="${!isEdit}">*</span>
                                    </label>
                                    <input type="password" class="form-control" id="password" th:field="*{password}" 
                                           placeholder="Enter password" 
                                           th:required="${!isEdit}">
                                    <div class="text-danger" th:if="${#fields.hasErrors('password')}" 
                                         th:errors="*{password}"></div>
                                    <small class="text-muted" th:if="${isEdit}">
                                        Leave empty to keep current password
                                    </small>
                                </div>

                                <div class="mb-3">
                                    <label for="firstName" class="form-label">First Name <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="firstName" th:field="*{firstName}" 
                                           placeholder="Enter first name" required>
                                    <div class="text-danger" th:if="${#fields.hasErrors('firstName')}" 
                                         th:errors="*{firstName}"></div>
                                </div>

                                <div class="mb-3">
                                    <label for="lastName" class="form-label">Last Name <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="lastName" th:field="*{lastName}" 
                                           placeholder="Enter last name" required>
                                    <div class="text-danger" th:if="${#fields.hasErrors('lastName')}" 
                                         th:errors="*{lastName}"></div>
                                </div>

                                <div class="mb-3">
                                    <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
                                    <input type="email" class="form-control" id="email" th:field="*{email}" 
                                           placeholder="Enter email" required>
                                    <div class="text-danger" th:if="${#fields.hasErrors('email')}" 
                                         th:errors="*{email}"></div>
                                </div>

                                <div class="mb-3">
                                    <label for="role" class="form-label">Role <span class="text-danger">*</span></label>
                                    <select class="form-select" id="role" th:field="*{role}" required>
                                        <option value="" selected disabled>Select role</option>
                                        <option th:each="role : ${roles}" 
                                                th:value="${role}" th:text="${role}"></option>
                                    </select>
                                    <div class="text-danger" th:if="${#fields.hasErrors('role')}" 
                                         th:errors="*{role}"></div>
                                </div>

                                <div class="mb-3" th:if="${isEdit}">
                                    <label class="form-label">Status</label>
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" id="active" 
                                               th:field="*{active}" th:checked="${user.active}">
                                        <label class="form-check-label" for="active">
                                            <span th:if="${user.active}">Active</span>
                                            <span th:if="${!user.active}">Inactive</span>
                                        </label>
                                    </div>
                                </div>

                                <div class="d-flex justify-content-end gap-2">
                                    <a th:href="@{/admin/users}" class="btn btn-outline-secondary">
                                        <i class="bi bi-arrow-left"></i> Cancel
                                    </a>
                                    <button type="submit" class="btn btn-primary">
                                        <i class="bi bi-check-circle"></i> 
                                        <span th:text="${isEdit ? 'Update User' : 'Create User'}"></span>
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
