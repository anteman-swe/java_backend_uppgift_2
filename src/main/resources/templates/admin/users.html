<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      lang="en"
      xml:lang="en">
<head>
    <title th:text="${title}">User Management</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="mb-6">
            <div class="flex justify-between items-center">
                <h1 class="text-2xl font-bold text-gray-800" th:text="${title}">User Management</h1>
                <a th:href="@{/admin/users/new}" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                    <i class="fas fa-plus-circle mr-2"></i> Create User
                </a>
            </div>
        </div>

        <!-- User Statistics -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-blue-500 text-white rounded-lg p-4 text-center">
                <i class="fas fa-users text-2xl mb-2"></i>
                <h3 class="text-xl font-bold" th:text="${users.size()}">0</h3>
                <p class="text-sm">Total Users</p>
            </div>
            <div class="bg-green-500 text-white rounded-lg p-4 text-center">
                <i class="fas fa-user-check text-2xl mb-2"></i>
                <h3 class="text-xl font-bold" th:text="${activeCount}">0</h3>
                <p class="text-sm">Active</p>
            </div>
            <div class="bg-yellow-500 text-white rounded-lg p-4 text-center">
                <i class="fas fa-user-times text-2xl mb-2"></i>
                <h3 class="text-xl font-bold" th:text="${inactiveCount}">0</h3>
                <p class="text-sm">Inactive</p>
            </div>
            <div class="bg-cyan-500 text-white rounded-lg p-4 text-center">
                <i class="fas fa-user-cog text-2xl mb-2"></i>
                <h3 class="text-xl font-bold" th:text="${agentCount}">0</h3>
                <p class="text-sm">Agents</p>
            </div>
        </div>

        <!-- Users Table -->
        <div class="bg-white rounded-lg shadow">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Username</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Role</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                            <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        <tr th:each="user : ${users}" class="hover:bg-gray-50 transition-colors">
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${user.id}"></td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-800" th:text="${user.username}"></td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${user.getFullName()}"></td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${user.email}"></td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <span th:class="${'px-2 inline-flex text-xs leading-5 font-semibold rounded-full ' + @formatUtils.getRoleBadgeClass(user.role)}"
                                      th:text="${user.role}"></span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <span th:if="${user.active}" class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">Active</span>
                                <span th:unless="${user.active}" class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-red-100 text-red-800">Inactive</span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                <a th:href="@{/admin/users/{id}/edit(id=${user.id})}" 
                                   class="text-indigo-600 hover:text-indigo-900 mr-2">
                                    <i class="fas fa-edit"></i>
                                </a>
                                <form th:action="@{/admin/users/{id}/toggle-status(id=${user.id})}" 
                                      method="post" class="inline-block">
                                    <button type="submit" class="text-yellow-600 hover:text-yellow-900 mr-2">
                                        <i th:if="${user.active}" class="fas fa-user-times"></i>
                                        <i th:unless="${user.active}" class="fas fa-user-check"></i>
                                    </button>
                                </form>
                                <form th:if="${user.id != #authentication.principal.id}"
                                      th:action="@{/admin/users/{id}/delete(id=${user.id})}" 
                                      method="post" class="inline-block" 
                                      onsubmit="return confirm('Are you sure you want to delete this user?')">
                                    <button type="submit" class="text-red-600 hover:text-red-900">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${users.isEmpty()}">
                            <td colspan="7" class="px-6 py-4 text-center text-sm text-gray-500">
                                No users found
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
