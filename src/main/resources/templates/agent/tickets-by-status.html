<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout/base}">
<head>
    <title th:text="${title}">Tickets by Status</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 th:text="${title}">Tickets by Status</h1>
                <a th:href="@{/agent/tickets}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> Back to All Tickets
                </a>
            </div>

            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Title</th>
                                    <th>Creator</th>
                                    <th>Assigned To</th>
                                    <th>Priority</th>
                                    <th>Created</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="ticket : ${tickets}">
                                    <td th:text="${ticket.id}"></td>
                                    <td>
                                        <a th:href="@{/tickets/{id}(id=${ticket.id})}" th:text="${ticket.title}"></a>
                                    </td>
                                    <td th:text="${ticket.createdBy.getFullName()}"></td>
                                    <td>
                                        <span th:if="${ticket.assignedTo}" th:text="${ticket.assignedTo.getFullName()}"></span>
                                        <span th:if="${!ticket.assignedTo}" class="text-muted">Unassigned</span>
                                    </td>
                                    <td>
                                        <span th:class="${'badge bg-' + (ticket.priority == 'LOW' ? 'success' : ticket.priority == 'MEDIUM' ? 'warning' : ticket.priority == 'HIGH' ? 'danger' : 'dark')}"
                                              th:text="${ticket.priority}"></span>
                                    </td>
                                    <td th:text="${#temporals.format(ticket.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                                    <td>
                                        <a th:href="@{/tickets/{id}(id=${ticket.id})}" 
                                           class="btn btn-sm btn-outline-primary">
                                            <i class="bi bi-eye"></i>
                                        </a>
                                        <form th:if="${!ticket.assignedTo}" 
                                              th:action="@{/agent/tickets/{id}/assign(id=${ticket.id})}" method="post" 
                                              class="d-inline">
                                            <button type="submit" class="btn btn-sm btn-success">
                                                <i class="bi bi-person-check"></i>
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                                <tr th:if="${tickets.empty}">
                                    <td colspan="7" class="text-center text-muted">
                                        No tickets found with status: <strong th:text="${status}"></strong>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
