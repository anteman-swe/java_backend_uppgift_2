<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      lang="en"
      xml:lang="en">
<head>
    <title th:text="${title}">All Tickets</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-gray-800" th:text="${title}">All Tickets</h1>
        </div>

        <!-- Statistics Cards -->
        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4 mb-6">
            <div class="bg-blue-500 text-white rounded-lg p-4 text-center">
                <i class="fas fa-ticket-alt text-2xl mb-2"></i>
                <h3 class="text-xl font-bold" th:text="${newCount}">0</h3>
                <p class="text-sm">New</p>
            </div>
            <div class="bg-yellow-500 text-white rounded-lg p-4 text-center">
                <i class="fas fa-sync-alt text-2xl mb-2"></i>
                <h3 class="text-xl font-bold" th:text="${inProgressCount}">0</h3>
                <p class="text-sm">In Progress</p>
            </div>
            <div class="bg-cyan-500 text-white rounded-lg p-4 text-center">
                <i class="fas fa-hourglass-half text-2xl mb-2"></i>
                <h3 class="text-xl font-bold" th:text="${waitingCount}">0</h3>
                <p class="text-sm">Waiting</p>
            </div>
            <div class="bg-green-500 text-white rounded-lg p-4 text-center">
                <i class="fas fa-check-circle text-2xl mb-2"></i>
                <h3 class="text-xl font-bold" th:text="${resolvedCount}">0</h3>
                <p class="text-sm">Resolved</p>
            </div>
            <div class="bg-gray-500 text-white rounded-lg p-4 text-center">
                <i class="fas fa-archive text-2xl mb-2"></i>
                <h3 class="text-xl font-bold" th:text="${closedCount}">0</h3>
                <p class="text-sm">Closed</p>
            </div>
            <div class="bg-gray-800 text-white rounded-lg p-4 text-center">
                <i class="fas fa-user-check text-2xl mb-2"></i>
                <h3 class="text-xl font-bold" th:text="${assignedCount}">0</h3>
                <p class="text-sm">Assigned to me</p>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <h5 class="text-lg font-medium text-gray-800 mb-4">Quick Actions</h5>
            <div class="flex flex-wrap gap-2">
                <a th:href="@{/agent/tickets/new}" class="inline-flex items-center px-3 py-2 border border-blue-300 text-sm font-medium rounded-md text-blue-700 bg-blue-50 hover:bg-blue-100 transition-colors">
                    <i class="fas fa-ticket-alt mr-1"></i> New Tickets
                </a>
                <a th:href="@{/agent/tickets/in-progress}" class="inline-flex items-center px-3 py-2 border border-yellow-300 text-sm font-medium rounded-md text-yellow-700 bg-yellow-50 hover:bg-yellow-100 transition-colors">
                    <i class="fas fa-sync-alt mr-1"></i> In Progress
                </a>
                <a th:href="@{/agent/tickets/assigned}" class="inline-flex items-center px-3 py-2 border border-cyan-300 text-sm font-medium rounded-md text-cyan-700 bg-cyan-50 hover:bg-cyan-100 transition-colors">
                    <i class="fas fa-user-check mr-1"></i> My Assigned
                </a>
                <a th:href="@{/agent/tickets/unassigned}" class="inline-flex items-center px-3 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-gray-50 hover:bg-gray-100 transition-colors">
                    <i class="fas fa-ticket mr-1"></i> Unassigned
                </a>
                <a th:href="@{/tickets/new}" class="inline-flex items-center px-3 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 transition-colors ml-auto">
                    <i class="fas fa-plus-circle mr-1"></i> Create Ticket
                </a>
            </div>
        </div>

        <!-- Tickets Table -->
        <div class="bg-white rounded-lg shadow">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Title</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Creator</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Assigned To</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Priority</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Created</th>
                            <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        <tr th:each="ticket : ${tickets}" class="hover:bg-gray-50 transition-colors">
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${ticket.id}"></td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <a th:href="@{/tickets/{id}(id=${ticket.id})}" class="text-indigo-600 hover:text-indigo-900 font-medium" th:text="${ticket.title}"></a>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${ticket.createdBy.getFullName()}"></td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm">
                                <span th:if="${ticket.assignedTo}" th:text="${ticket.assignedTo.getFullName()}"></span>
                                <span th:unless="${ticket.assignedTo}" class="text-gray-500">Unassigned</span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <span th:class="${'px-2 inline-flex text-xs leading-5 font-semibold rounded-full ' + (@formatUtils.getTicketStatusClass(ticket.status))}"
                                      th:text="${ticket.status}"></span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <span th:class="${'px-2 inline-flex text-xs leading-5 font-semibold rounded-full ' + (@formatUtils.getTicketPriorityClass(ticket.priority))}"
                                      th:text="${ticket.priority}"></span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${#temporals.format(ticket.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                            <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                <a th:href="@{/tickets/{id}(id=${ticket.id})}" 
                                   class="text-indigo-600 hover:text-indigo-900 mr-2">
                                    <i class="fas fa-eye"></i>
                                </a>
                                <form th:unless="${ticket.assignedTo}"
                                      th:action="@{/agent/tickets/{id}/assign(id=${ticket.id})}" method="post" 
                                      class="d-inline">
                                    <button type="submit" class="inline-flex items-center px-3 py-1 border border-transparent text-xs font-medium rounded-md text-white bg-green-600 hover:bg-green-700 transition-colors">
                                        <i class="fas fa-user-check mr-1"></i> Assign to Me
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${tickets.isEmpty()}">
                            <td colspan="8" class="px-6 py-4 text-center text-sm text-gray-500">
                                No tickets found
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
