<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout/base}">
<head>
    <title th:text="${title}">All Tickets</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="container">
            <h1 th:text="${title}">All Tickets</h1>

            <!-- Statistics Cards -->
            <div class="row mb-4">
                <div class="col-md-2 col-6 mb-3">
                    <div class="card text-white bg-primary">
                        <div class="card-body text-center">
                            <i class="bi bi-ticket-perforated" style="font-size: 2rem;"></i>
                            <h3 class="mt-2" th:text="${newCount}">0</h3>
                            <p class="mb-0">New</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-2 col-6 mb-3">
                    <div class="card text-white bg-warning">
                        <div class="card-body text-center">
                            <i class="bi bi-arrow-repeat" style="font-size: 2rem;"></i>
                            <h3 class="mt-2" th:text="${inProgressCount}">0</h3>
                            <p class="mb-0">In Progress</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-2 col-6 mb-3">
                    <div class="card text-white bg-info">
                        <div class="card-body text-center">
                            <i class="bi bi-hourglass-split" style="font-size: 2rem;"></i>
                            <h3 class="mt-2" th:text="${waitingCount}">0</h3>
                            <p class="mb-0">Waiting</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-2 col-6 mb-3">
                    <div class="card text-white bg-success">
                        <div class="card-body text-center">
                            <i class="bi bi-check-circle" style="font-size: 2rem;"></i>
                            <h3 class="mt-2" th:text="${resolvedCount}">0</h3>
                            <p class="mb-0">Resolved</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-2 col-6 mb-3">
                    <div class="card text-white bg-secondary">
                        <div class="card-body text-center">
                            <i class="bi bi-archive" style="font-size: 2rem;"></i>
                            <h3 class="mt-2" th:text="${closedCount}">0</h3>
                            <p class="mb-0">Closed</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-2 col-6 mb-3">
                    <div class="card text-white bg-dark">
                        <div class="card-body text-center">
                            <i class="bi bi-person-check" style="font-size: 2rem;"></i>
                            <h3 class="mt-2" th:text="${assignedCount}">0</h3>
                            <p class="mb-0">Assigned</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="card mb-4">
                <div class="card-body">
                    <h5 class="card-title">Quick Actions</h5>
                    <div class="d-flex gap-2 flex-wrap">
                        <a th:href="@{/agent/tickets/new}" class="btn btn-outline-primary">
                            <i class="bi bi-ticket-perforated"></i> New Tickets
                        </a>
                        <a th:href="@{/agent/tickets/in-progress}" class="btn btn-outline-warning">
                            <i class="bi bi-arrow-repeat"></i> In Progress
                        </a>
                        <a th:href="@{/agent/tickets/assigned}" class="btn btn-outline-info">
                            <i class="bi bi-person-check"></i> My Assigned
                        </a>
                        <a th:href="@{/agent/tickets/unassigned}" class="btn btn-outline-secondary">
                            <i class="bi bi-ticket-detailed"></i> Unassigned
                        </a>
                        <a th:href="@{/tickets/new}" class="btn btn-primary ms-auto">
                            <i class="bi bi-plus-circle"></i> Create Ticket
                        </a>
                    </div>
                </div>
            </div>

            <!-- Tickets Table -->
            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Title</th>
                                    <th>Creator</th>
                                    <th>Assigned To</th>
                                    <th>Status</th>
                                    <th>Priority</th>
                                    <th>Created</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="ticket : ${tickets}">
                                    <td th:text="${ticket.id}"></td>
                                    <td>
                                        <a th:href="@{/tickets/{id}(id=${ticket.id})}" th:text="${ticket.title}"></a>
                                    </td>
                                    <td th:text="${ticket.createdBy.getFullName()}"></td>
                                    <td>
                                        <span th:if="${ticket.assignedTo}" th:text="${ticket.assignedTo.getFullName()}"></span>
                                        <span th:if="${!ticket.assignedTo}" class="text-muted">Unassigned</span>
                                    </td>
                                    <td>
                                        <span th:class="${'badge bg-' + ticket.status.name().toLowerCase()}"
                                              th:text="${ticket.status}"></span>
                                    </td>
                                    <td>
                                        <span th:class="${'badge bg-' + (ticket.priority == 'LOW' ? 'success' : ticket.priority == 'MEDIUM' ? 'warning' : ticket.priority == 'HIGH' ? 'danger' : 'dark')}"
                                              th:text="${ticket.priority}"></span>
                                    </td>
                                    <td th:text="${#temporals.format(ticket.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                                    <td>
                                        <a th:href="@{/tickets/{id}(id=${ticket.id})}" 
                                           class="btn btn-sm btn-outline-primary">
                                            <i class="bi bi-eye"></i>
                                        </a>
                                        <form th:if="${!ticket.assignedTo}" 
                                              th:action="@{/agent/tickets/{id}/assign(id=${ticket.id})}" method="post" 
                                              class="d-inline">
                                            <button type="submit" class="btn btn-sm btn-success">
                                                <i class="bi bi-person-check"></i>
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                                <tr th:if="${tickets.empty}">
                                    <td colspan="8" class="text-center text-muted">
                                        No tickets found
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
