<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Error - Helpdesk System</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/}">
                <i class="bi bi-ticket-perforated"></i> Helpdesk
            </a>
            <div class="d-flex">
                <a class="nav-link" th:href="@{/login}">
                    <i class="bi bi-box-arrow-in-right"></i> Login
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-danger text-white">
                        <h4><i class="bi bi-exclamation-triangle-fill"></i> Error</h4>
                    </div>
                    <div class="card-body">
                        <div class="text-center">
                            <i class="bi bi-exclamation-circle" style="font-size: 4rem; color: #dc3545;"></i>
                            <h2 class="mt-3">Access Denied</h2>
                            <p class="lead">You don't have permission to access this page.</p>
                            <p th:if="${param.accessDenied}">Please login with appropriate credentials.</p>
                            <div class="mt-4">
                                <a th:href="@{/login}" class="btn btn-primary">
                                    <i class="bi bi-box-arrow-in-right"></i> Go to Login
                                </a>
                                <a th:href="@{/}" class="btn btn-outline-secondary ms-2">
                                    <i class="bi bi-house"></i> Go to Home
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
