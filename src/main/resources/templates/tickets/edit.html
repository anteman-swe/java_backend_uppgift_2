<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout/base}">
<head>
    <title th:text="${title}">Edit Ticket</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="card">
                        <div class="card-header">
                            <h2 th:text="${title}">Edit Ticket</h2>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/tickets/{id}/edit(id=${ticket.id})}" th:object="${ticket}" method="post">
                                <div class="mb-3">
                                    <label for="title" class="form-label">Title <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="title" th:field="*{title}" 
                                           placeholder="Enter ticket title" required>
                                    <div class="text-danger" th:if="${#fields.hasErrors('title')}" 
                                         th:errors="*{title}"></div>
                                </div>

                                <div class="mb-3">
                                    <label for="description" class="form-label">Description <span class="text-danger">*</span></label>
                                    <textarea class="form-control" id="description" th:field="*{description}" 
                                              rows="5" placeholder="Enter detailed description" required></textarea>
                                    <div class="text-danger" th:if="${#fields.hasErrors('description')}" 
                                         th:errors="*{description}"></div>
                                </div>

                                <div class="mb-3">
                                    <label for="category" class="form-label">Category</label>
                                    <input type="text" class="form-control" id="category" th:field="*{category}" 
                                           placeholder="Enter category">
                                </div>

                                <div class="mb-3">
                                    <label for="priority" class="form-label">Priority</label>
                                    <select class="form-select" id="priority" th:field="*{priority}">
                                        <option th:each="priority : ${priorities}" 
                                                th:value="${priority}" th:text="${priority}"></option>
                                    </select>
                                </div>

                                <div class="mb-3">
                                    <label for="status" class="form-label">Status</label>
                                    <select class="form-select" id="status" th:field="*{status}">
                                        <option th:each="status : ${statuses}" 
                                                th:value="${status}" th:text="${status}"></option>
                                    </select>
                                </div>

                                <div class="d-flex justify-content-end gap-2">
                                    <a th:href="@{/tickets/{id}(id=${ticket.id})}" class="btn btn-outline-secondary">
                                        <i class="bi bi-arrow-left"></i> Cancel
                                    </a>
                                    <button type="submit" class="btn btn-primary">
                                        <i class="bi bi-check-circle"></i> Update Ticket
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
