<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="en"
      xml:lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">Helpdesk System</title>
    
    <!-- Tailwind CSS -->
    <link rel="stylesheet" th:href="@{/css/output.css}">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
    crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="bg-gray-800 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center">
                    <a th:href="@{/}" class="flex items-center space-x-2 text-xl font-bold">
                        <i class="fas fa-ticket-alt"></i>
                        <span>Helpdesk</span>
                    </a>
                </div>
                
                <!-- Desktop Navigation -->
                <div class="hidden md:block">
                    <div th:if="${#authorization.expression('isAuthenticated()')}" class="ml-10 flex items-baseline space-x-4">
                        <a th:href="@{/tickets}" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-gray-700 hover:text-white transition-colors">
                            My Tickets
                        </a>
                        <a th:if="${#authorization.expression('hasRole(''AGENT'')') || #authorization.expression('hasRole(''ADMIN'')')}" th:href="@{/agent/tickets}" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-gray-700 hover:text-white transition-colors">
                            All tickets
                        </a>
                        <a th:if="${#authorization.expression('hasRole(''ADMIN'')')}" th:href="@{/admin/users}" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-gray-700 hover:text-white transition-colors">
                            Users
                        </a>
                    </div>
                </div>
                
                <!-- Authentication Links -->
                <div class="hidden md:block">
                    <div th:if="${#authorization.expression('isAuthenticated()')}" class="ml-4 flex items-center md:ml-6">
                        <div class="relative">
                            <button type="button" class="flex items-center space-x-2 bg-gray-800 rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-800 focus:ring-white" id="user-menu-button">
                                <i class="fas fa-user-circle"></i>
                                <span th:text="${#authentication.principal.fullName}"></span>
                                <i class="fas fa-chevron-down text-xs"></i>
                            </button>
                            
                            <!-- Dropdown menu -->
                            <div class="absolute right-0 z-10 mt-2 w-48 rounded-md shadow-lg py-1 bg-white ring-1 ring-black ring-opacity-5 focus:outline-none hidden" id="user-menu">
                                <div class="px-4 py-2 text-sm text-gray-700 border-b border-gray-200">
                                    <i class="fas fa-user mr-2"></i>
                                    <span th:text="${#authentication.principal.fullName}"></span>
                                </div>
                                <div class="px-4 py-2 text-sm text-gray-700 border-b border-gray-200">
                                    <i class="fas fa-tag mr-2"></i>
                                    <span th:text="${#authentication.principal.role}"></span>
                                </div>
                                <form th:action="@{/logout}" method="post" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
                                    <button type="submit" class="w-full text-left">
                                        <i class="fas fa-sign-out-alt mr-2"></i> Logout
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                    <a th:unless="${#authorization.expression('isAuthenticated()')}" th:href="@{/login}" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-gray-700 hover:text-white transition-colors">
                        <i class="fas fa-sign-in-alt mr-1"></i> Login
                    </a>
                </div>
                
                <!-- Mobile menu button -->
                <div class="md:hidden">
                    <button type="button" class="inline-flex items-center justify-center p-2 rounded-md text-gray-400 hover:text-white hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-white" id="mobile-menu-button">
                        <i class="fas fa-bars"></i>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Mobile menu -->
        <div class="md:hidden hidden" id="mobile-menu">
            <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3">
                <a th:href="@{/tickets}" class="block px-3 py-2 rounded-md text-base font-medium text-gray-300 hover:text-white hover:bg-gray-700">
                    My Tickets
                </a>
                <a th:if="${#authorization.expression('hasRole(''AGENT'')') || #authorization.expression('hasRole(''ADMIN'')')}" th:href="@{/agent/tickets}" class="block px-3 py-2 rounded-md text-base font-medium text-gray-300 hover:text-white hover:bg-gray-700">
                    All Tickets
                </a>
                <a th:if="${#authorization.expression('hasRole(''ADMIN'')')}" th:href="@{/admin/users}" class="block px-3 py-2 rounded-md text-base font-medium text-gray-300 hover:text-white hover:bg-gray-700">
                    Users
                </a>
                <div th:if="${#authorization.expression('isAuthenticated()')}" class="border-t border-gray-700 pt-4">
                    <div class="px-3 py-2 text-sm text-gray-400">
                        <i class="fas fa-user mr-2"></i>
                        <span th:text="${#authentication.principal.fullName}"></span>
                    </div>
                    <div class="px-3 py-2 text-sm text-gray-400">
                        <i class="fas fa-tag mr-2"></i>
                        <span th:text="${#authentication.principal.role}"></span>
                    </div>
                    <form th:action="@{/logout}" method="post" class="block px-3 py-2">
                        <button type="submit" class="w-full text-left text-sm text-gray-300 hover:text-white">
                            <i class="fas fa-sign-out-alt mr-2"></i> Logout
                        </button>
                    </form>
                </div>
                <a th:unless="${#authorization.expression('isAuthenticated()')}" th:href="@{/login}" class="block px-3 py-2 rounded-md text-base font-medium text-gray-300 hover:text-white hover:bg-gray-700">
                    <i class="fas fa-sign-in-alt mr-1"></i> Login
                </a>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
        <div layout:fragment="content"></div>
    </main>

    <!-- JavaScript for mobile menu and dropdown -->
    <script>
        // Mobile menu toggle
        document.getElementById('mobile-menu-button').addEventListener('click', function() {
            const mobileMenu = document.getElementById('mobile-menu');
            mobileMenu.classList.toggle('hidden');
        });
        
        // User menu dropdown toggle
        document.getElementById('user-menu-button').addEventListener('click', function() {
            const userMenu = document.getElementById('user-menu');
            userMenu.classList.toggle('hidden');
        });
        
        // Close dropdown when clicking outside
        document.addEventListener('click', function(event) {
            const userMenu = document.getElementById('user-menu');
            const userMenuButton = document.getElementById('user-menu-button');
            if (!userMenuButton.contains(event.target) && !userMenu.contains(event.target)) {
                userMenu.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
